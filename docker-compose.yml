services:
  meshlink:
    image: rozaq220301/meshlink:${MESHLINK_IMAGE_TAG:-latest}
    # For a source checkout instead of Docker Hub, uncomment this line:
    # build: .
    restart: unless-stopped
    ports:
      # Keep the dashboard/API local. Put TLS or a private VPN in front of it
      # before changing this to 0.0.0.0.
      - "127.0.0.1:${MESHLINK_PORT:-20128}:20128"
    environment:
      MESHLINK_DASHBOARD_PASSWORD: ${MESHLINK_DASHBOARD_PASSWORD:?Set a strong dashboard password in .env}
      MESHLINK_TRUSTED_AGENTS: ${MESHLINK_TRUSTED_AGENTS:?Set trusted signed agents in .env}
      MESHLINK_RATE_LIMIT_MAX: ${MESHLINK_RATE_LIMIT_MAX:-120}
    volumes:
      - meshlink-data:/data
      - ./examples/policy.yaml:/config/policy.yaml:ro
    command:
      - node
      - start
      - --name
      - ${MESHLINK_NODE_NAME:-meshlink-node}
      - --id
      - ${MESHLINK_NODE_ID:-meshlink-node}
      - --host
      - 0.0.0.0
      - --port
      - "20128"
      - --endpoint
      - ${MESHLINK_ENDPOINT:?Set the private-VPN or HTTPS endpoint in .env}
      - --policy
      - /config/policy.yaml
      - --storage
      - /data/state.db

volumes:
  meshlink-data:
