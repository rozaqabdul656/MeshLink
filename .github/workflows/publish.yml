name: Publish npm package

on:
  push:
    tags:
      - "v*"

# npm Trusted Publishing exchanges this short-lived GitHub OIDC identity for
# publish access. No NPM_TOKEN is stored in this repository.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "$GITHUB_REF_NAME"

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm when this version is new
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping."
          else
            npm publish
          fi
