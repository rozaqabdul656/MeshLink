name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# npm Trusted Publishing exchanges this short-lived GitHub OIDC identity for
# publish access. No NPM_TOKEN is stored in this repository.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm when this version is new
        run: |
          if npm view "${npm_package_name}@${npm_package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${npm_package_name}@${npm_package_version} is already published; skipping."
          else
            npm publish
          fi
